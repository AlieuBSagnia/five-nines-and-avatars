{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prima-api.serviceAccountName" . }}
  labels:
    {{- include "prima-api.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.eksRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.eksRoleArn | quote }}
  {{- end }}
{{- end }}
