apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prima-api.fullname" . }}-config
  labels:
    {{- include "prima-api.labels" . | nindent 4 }}
data:
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  AWS_ENDPOINT_URL: {{ .Values.config.awsEndpointUrl | quote }}
  DYNAMODB_TABLE_NAME: {{ .Values.config.dynamodbTableName | quote }}
  S3_BUCKET_NAME: {{ .Values.config.s3BucketName | quote }}
  S3_PUBLIC_BASE_URL: {{ .Values.config.s3PublicBaseUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
