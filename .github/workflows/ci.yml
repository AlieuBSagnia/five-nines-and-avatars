name: CI

# Runs on every PR and on pushes to main. Kept as a single workflow with
# independent jobs (rather than one long job) so failures are attributable
# at a glance and unrelated stages (e.g. chart lint vs. python tests) run
# in parallel instead of blocking each other.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-python:
    name: Lint & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-image:
    name: Build & scan Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test-python
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prima-tech-challenge/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prima-tech-challenge/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository | toLower }}:${{ github.sha }}
            ghcr.io/${{ github.repository | toLower }}:latest

  validate-terraform:
    name: Validate & scan Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Static security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  validate-helm:
    name: Lint & template Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "v3.15.4"

      - name: helm lint
        run: helm lint helm/prima-api

      - name: helm template (catch rendering errors early)
        run: helm template prima-api helm/prima-api

      - name: helm template with local values
        run: helm template prima-api helm/prima-api -f helm/prima-api/values-local.yaml

      - name: Validate rendered manifests against Kubernetes schemas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template prima-api helm/prima-api | ./kubeconform -strict -summary
